subprojects {
	apply plugin: "java"

	group = project.mod_group

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
		withSourcesJar()
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	tasks.withType(AbstractArchiveTask).configureEach {
		destinationDirectory = rootProject.layout.buildDirectory.dir("libs")
	}

	tasks.withType(Jar).configureEach {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}

	tasks.withType(Copy).configureEach {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}

	repositories {
		maven { url = 'https://maven.shedaniel.me/' }
		maven { url = 'https://maven.terraformersmc.com/' }
		maven { url = 'https://api.modrinth.com/maven' }
	}

	processResources {
		def props = [
				"mod_id": project.mod_id,
				"mod_name": project.mod_name,
				"mod_version": project.mod_version,
				"mod_description": project.mod_description,
				"mod_license": project.mod_license,
				"minecraft_version": project.minecraft_version,
				"fabric_loader_version": project.fabric_loader_version,
				"fabric_loader_min_version": project.fabric_loader_min_version,
				"neoforge_loader_version": project.neoforge_loader_version,
				"neoforge_loader_min_version": project.neoforge_loader_min_version,
				"java_version": project.java_version
		]
		inputs.properties(props)

		filesMatching('fabric.mod.json') {
			expand props
		}
		filesMatching('META-INF/neoforge.mods.toml') {
			expand props
		}
	}
}

project(':fabric') {
	base {
		archivesName = "${project.mod_id}-${project.mod_version}-${project.minecraft_version}-fabric"
	}
}

project(':neoforge') {
	base {
		archivesName = "${project.mod_id}-${project.mod_version}-${project.minecraft_version}-neoforge"
	}
}
