plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

configurations {
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
}

tasks.named("sourcesJar") {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
    mixin {
        defaultRefmapName = "enchanted_grinding.refmap.json"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    commonJava project(path: ':common', configuration: 'commonJava')
    implementation project(':common')

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "maven.modrinth:tax-free-levels:${project.tax_levels_version_fabric}"
}

sourceSets {
    main {
        java {
            srcDirs += configurations.commonJava
        }
    }
}

processResources {
    from(project(":common").sourceSets.main.resources)
}

def licenseFile = rootProject.layout.projectDirectory.file("LICENSE")
def projectName = rootProject.name

tasks.named("jar") {
    from(licenseFile) {
        rename { "${it}_${projectName}" }
    }
}